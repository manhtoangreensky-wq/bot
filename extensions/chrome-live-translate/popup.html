<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TOAN AAS Live Translate</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .badge {
      background: #2563eb;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    select {
      width: 100%;
      padding: 8px 10px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #f1f5f9;
      font-size: 13px;
      outline: none;
    }
    .btn-primary {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-stop {
      background: #dc2626;
    }
    .btn-stop:hover {
      background: #b91c1c;
    }
    .status-text {
      font-size: 12px;
      color: #10b981;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">文 VI</span>
    <span class="title">TOAN AAS Live Dub</span>
  </div>

  <div class="form-group">
    <label>Chế độ dịch:</label>
    <select id="select-mode">
      <option value="LIVE_DUB_BILINGUAL" selected>Lồng tiếng + Phụ đề song ngữ</option>
      <option value="CAPTION_TRANSLATE">Chỉ phụ đề dịch (Không dub)</option>
      <option value="CAPTION_ONLY">Chỉ nhận diện phụ đề gốc</option>
    </select>
  </div>

  <div class="form-group">
    <label>Ngôn ngữ dịch sang:</label>
    <select id="select-lang">
      <option value="vi" selected>Tiếng Việt (vi)</option>
      <option value="en">English (en)</option>
      <option value="zh">Tiếng Trung (zh)</option>
      <option value="ja">Tiếng Nhật (ja)</option>
    </select>
  </div>

  <div class="form-group">
    <label>Giọng lồng tiếng:</label>
    <select id="select-voice">
      <option value="male" selected>Nam Minh (Giọng Nam trầm ấm)</option>
      <option value="female">Hoài My (Giọng Nữ truyền cảm)</option>
      <option value="voice_vault">Voice Vault (Giọng cá nhân của tôi)</option>
    </select>
  </div>

  <button id="btn-toggle" class="btn-primary">▶ Bắt đầu dịch tab này</button>
  <div id="status-msg" class="status-text" style="display: none;"></div>

  <script src="popup.js"></script>
</body>
</html>
