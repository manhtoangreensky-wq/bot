name: Deploy Bot to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-vps-bot
  cancel-in-progress: false

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python Compile Guard
        run: |
          python -m py_compile bot.py services/*.py

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=10 "$VPS_USER@$VPS_HOST" "
            set -euo pipefail
            echo '=== Pulling Bot Repo on VPS ==='
            cd /opt/toanaas/bot
            git fetch origin --prune
            git checkout main
            git pull origin main

            echo '=== Pulling Worker Repo on VPS ==='
            cd /opt/toanaas-worker
            git fetch origin --prune
            git checkout main
            git pull origin main

            echo '=== Restarting Bot and Worker Services ==='
            systemctl restart toanaas-bot.service toanaas-worker-owner-product-video.service toanaas-video-edit-worker.service

            echo '=== Verifying Active Services ==='
            systemctl is-active toanaas-bot.service
            systemctl is-active toanaas-worker-owner-product-video.service
            systemctl is-active toanaas-video-edit-worker.service

            echo '=== BOT DEPLOY SUCCESS ==='
          "
