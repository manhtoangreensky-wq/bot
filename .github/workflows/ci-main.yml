name: CI Main & PR Quality Guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_hygiene_and_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Complete Bot Source
        run: |
          python scripts/check_bot_source_compile.py

      - name: Python Compile Guard
        run: |
          python -m py_compile bot.py remote_worker.py services/remote_worker_api.py services/*.py tests/test_deploy_vps_workflow_hygiene.py

      - name: Media Preview Callback Regressions
        run: python -m unittest tests/test_media_preview_callback_snapshot.py

      - name: Admin Package Orders Back Regression
        run: python -m unittest tests/test_admin_package_orders_back_origin.py

      - name: Admin Security DB Back Regression
        run: python -m unittest tests/test_admin_security_db_back_origin.py

      - name: Admin Route Regressions
        run: |
          python -m unittest \
            tests/test_admin_module_child_back_origin.py \
            tests/test_support_ticket_reply_origin_pagination.py \
            tests/test_support_admin_ticket_origin_pagination.py \
            tests/test_support_admin_ticket_note_origin_pagination.py \
            tests/test_support_ticket_ask_stale_guard.py \
            tests/test_support_ticket_note_stale_guard.py \
            tests/test_support_admin_ticket_back_pagination.py \
            tests/test_admin_help_callback_single_ack.py \
            tests/test_admin_billing_guide_labels.py \
            tests/test_admin_runtime_help_back_origin.py \
            tests/test_admin_root_menu_callback_single_ack.py \
            tests/test_callback_dispatch_timing.py

      - name: Run Workflow Hygiene Unit Tests
        run: |
          python -m unittest tests/test_deploy_vps_workflow_hygiene.py
