name: CI Main & PR Quality Guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_hygiene_and_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Complete Bot Source
        run: |
          python scripts/check_bot_source_compile.py

      - name: Python Compile Guard
        run: |
          python -m py_compile bot.py remote_worker.py services/remote_worker_api.py services/*.py tests/test_deploy_vps_workflow_hygiene.py

      - name: Media Preview Callback Regressions
        run: python -m unittest tests/test_media_preview_callback_snapshot.py

      - name: Admin Package Orders Back Regression
        run: python -m unittest tests/test_admin_package_orders_back_origin.py

      - name: Admin Security DB Back Regression
        run: python -m unittest tests/test_admin_security_db_back_origin.py

      - name: Admin Route Regressions
        run: |
          python -m unittest \
            tests/test_admin_ticket_hub_navigation.py \
            tests/test_admin_feedback_inbox_navigation.py \
            tests/test_admin_queue_confirm_back_origin.py \
            tests/test_admin_module_child_back_origin.py \
            tests/test_admin_finance_action_renderers.py \
            tests/test_support_ticket_reply_origin_pagination.py \
            tests/test_support_admin_ticket_origin_pagination.py \
            tests/test_support_admin_ticket_note_origin_pagination.py \
            tests/test_support_ticket_ask_stale_guard.py \
            tests/test_support_ticket_note_stale_guard.py \
            tests/test_support_admin_ticket_back_pagination.py \
            tests/test_admin_help_callback_single_ack.py \
            tests/test_admin_billing_guide_labels.py \
            tests/test_admin_runtime_help_back_origin.py \
            tests/test_admin_root_menu_callback_single_ack.py \
            tests/test_callback_dispatch_timing.py

      - name: Stale Self-shot Callback Acknowledgement
        run: python -m unittest tests/test_selfshot_stale_callback_ack.py

      - name: Account Credit Guide Back Regression
        run: python -m unittest tests/test_profile_credit_guide_back_origin.py

      - name: Account Pricing Back Regressions
        run: python -m unittest tests/test_profile_pricing_back_origin.py

      - name: Account Language Back Regressions
        run: python -m unittest tests/test_profile_language_back_origin.py

      - name: Account Support Read-only Back Regressions
        run: python -m unittest tests/test_profile_support_read_back_origin.py

      - name: Account Support Pending Back Regressions
        run: python -m unittest tests/test_profile_support_pending_origin.py

      - name: Customer Ticket Action Acknowledgement
        run: python -m unittest tests/test_customer_ticket_action_ack.py

      - name: Account Owned Ticket Ancestry
        run: python -m unittest tests/test_profile_ticket_ancestry.py

      - name: Account Top-up Selector Back
        run: python -m unittest tests/test_profile_topup_back_origin.py

      - name: Package Combo Registered Navigation Back
        run: python -m unittest tests/test_pkgcombo_navigation_registered_callback.py

      - name: Customer Memory and Storage Add-on Navigation Regressions
        run: |
          python -m unittest \
            tests/test_memory_empty_delete_state.py \
            tests/test_memory_pending_reset_on_start.py \
            tests/test_storage_addon_navigation_callbacks.py

      - name: Small Navigation and UI Closure Regressions
        run: |
          python -m pip install pytest PyYAML
          python -c "from pathlib import Path; import yaml; yaml.safe_load(Path('.agents/state/telegram-small-flow-audit-20261006.yaml').read_text(encoding='utf-8')); print('UI state YAML PASS')"
          python -m pytest -q --noconftest \
            tests/test_admin_marketing_support_back_origin.py \
            tests/test_owner_access_ui_runtime_copy.py \
            tests/test_small_flow_pending_expiry.py \
            tests/test_feedback_callback_single_ack.py \
            tests/test_marketing_callback_single_ack.py \
            tests/test_admin_tool_test_pending_reset.py \
            tests/test_broadcast_lite_back_pending_cleanup.py \
            tests/test_start_translation_pending_reset.py \
            tests/test_menu_video_callback_timing.py

      - name: Run Workflow Hygiene Unit Tests
        run: |
          python -m unittest tests/test_deploy_vps_workflow_hygiene.py
