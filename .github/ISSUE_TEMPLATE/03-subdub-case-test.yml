name: SubDub case test
description: Ghi bằng chứng cho một case SD-* trong KIEM-THU/DANH-SACH-CASE.md
title: "[SubDub Test] "
labels: ["case-test", "chờ-test"]
body:
  - type: markdown
    attributes:
      value: "Sửa case thì sửa KIEM-THU/DANH-SACH-CASE.md trước. Chạy đúng thứ tự SD-2S-01 -> SD-2S-02 -> SD-MS-01."
  - type: input
    id: case_id
    attributes:
      label: Case ID
      placeholder: SD-2S-01
    validations:
      required: true
  - type: input
    id: runtime_sha
    attributes:
      label: Runtime SHA
    validations:
      required: true
  - type: textarea
    id: flow
    attributes:
      label: Flow và stage
      description: Ghi fixture hash, lane, ngôn ngữ, numeric gốc/lồng, confirm hoặc same-job recovery, strict word/acoustic stage, TTS/mux/delivery. Với SD-MS-L* ghi model hash, CPU provider, units/windows/k/stability; không dán raw payload/PCM/embedding.
    validations:
      required: true
  - type: textarea
    id: artifact
    attributes:
      label: Artifact và receipt
      description: Ghi job id/attempt, MP4/receipt message id, hash/bytes/codecs/duration/audio, speaker/voice/cue/timing aggregates và từng thành phần giá. Job/HTTP 200/model output đơn lẻ không phải PASS.
    validations:
      required: true
  - type: textarea
    id: wallet
    attributes:
      label: Xu và wallet evidence
      description: Ghi list price, charged_xu, credits/total_spent/transaction delta trước và sau.
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Kết quả
      options: [PASS, FAIL, BLOCKED]
    validations:
      required: true
